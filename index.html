<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    
    <!-- SEO Meta Tags -->
    <title>RootsTechNews - Professional Technology Insights</title>
    <meta name="description" content="Discover tomorrow's technology today. Professional tech news, AI insights, startup coverage, and innovation analysis from a global perspective." />
    <meta name="keywords" content="technology news, AI, startups, tech analysis, innovation, gadgets, cybersecurity, business technology" />
    <meta name="author" content="RootsTechNews" />
    <link rel="canonical" href="https://rootstechnews.com" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rootstechnews.com" />
    <meta property="og:title" content="RootsTechNews - Professional Technology Insights" />
    <meta property="og:description" content="Discover tomorrow's technology today. Professional tech news, AI insights, startup coverage, and innovation analysis." />
    <meta property="og:image" content="https://rootstechnews.com/og-image.jpg" />
    <meta property="og:site_name" content="RootsTechNews" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://rootstechnews.com" />
    <meta property="twitter:title" content="RootsTechNews - Professional Technology Insights" />
    <meta property="twitter:description" content="Discover tomorrow's technology today. Professional tech news, AI insights, startup coverage, and innovation analysis." />
    <meta property="twitter:image" content="https://rootstechnews.com/og-image.jpg" />
    <meta property="twitter:creator" content="@RootsTechNews" />
    
    <!-- Performance Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Critical resource preconnect hints for performance -->
    <link rel="preconnect" href="https://newsapi.org" crossorigin />
    
    <!-- Font loading optimization -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RootsTechNews",
      "description": "Professional technology insights and analysis",
      "url": "https://rootstechnews.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://rootstechnews.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "RootsTechNews",
        "logo": {
          "@type": "ImageObject",
          "url": "https://rootstechnews.com/logo.png"
        }
      }
    }
    </script>
    
    <!-- Process.env polyfill for browser compatibility -->
    <script>
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      // Set NODE_ENV based on hostname (development for localhost, production otherwise)
      window.process.env.NODE_ENV = (window.location.hostname === 'localhost' || 
                                     window.location.hostname === '127.0.0.1' || 
                                     window.location.hostname.includes('.local')) 
                                     ? 'development' 
                                     : 'production';
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Loading indicator shown before JavaScript loads -->
      <div id="loading" class="loading-screen" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); font-family: 'Inter', sans-serif; color: #1A237E;">
        <div style="text-align: center;">
          <h1 style="font-size: 32px; font-weight: 700; margin: 0 0 10px 0; font-family: 'Playfair Display', serif;">
            RootsTechNews
          </h1>
          <p style="font-size: 14px; color: #6c757d; margin: 0; animation: pulse 1.5s ease-in-out infinite;">
            Loading...
          </p>
          <div style="margin-top: 20px; font-size: 12px; color: #666;">
            <p style="margin: 5px 0;">If this message persists:</p>
            <p style="margin: 5px 0;">1. Check your browser console (F12)</p>
            <p style="margin: 5px 0;">2. Try clearing your cache</p>
            <p style="margin: 5px 0;">3. Ensure JavaScript is enabled</p>
          </div>
        </div>
      </div>
      <style>
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.6; transform: scale(1.05); }
        }
        /* Force hide loading screen after React loads */
        #root:has(> :not(#loading)) #loading,
        #root:has(> :not(.loading-screen)) .loading-screen {
          display: none !important;
          visibility: hidden !important;
          opacity: 0 !important;
        }
      </style>
    </div>
    <!-- Loading screen fix script - loads early to prevent stuck loading screens -->
    <script src="/loading-fix.js"></script>
    <script type="module" src="src/main.tsx"></script>
    <script src="/complete-rss-fix.js"></script>
  </body>
</html>
